# /etc/nginx/sites-available/control-actas  →  ln -s a sites-enabled
server {
    listen 80;
    server_name actas.firmared.com;   # cambiar por el subdominio elegido

    client_max_body_size 20M;          # subida de PDF de respaldo

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;        # la carga en lote descarga varias actas de RAI
        proxy_send_timeout 300;
    }
}
